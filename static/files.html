<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pi-web · files</title>
  <link rel="icon" type="image/svg+xml" href="pi-logo.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="files.css">
</head>
<body class="files-page">
  <div id="fs-header">
    <button id="fs-toggle-list" class="fs-btn" title="Collapse / expand the file list">«</button>
    <span id="fs-title">Files</span>
    <nav id="fs-crumbs" aria-label="path"></nav>
    <span id="theme-switch">
      <span class="theme-option" data-theme="dark">Dark</span>
      <span class="theme-sep">|</span>
      <span class="theme-option" data-theme="light">Light</span>
    </span>
    <span id="fs-tools">
      <input id="fs-filter" type="search" placeholder="filter…" autocomplete="off" spellcheck="false">
      <button id="fs-sort" class="fs-btn" title="Sort by name / modified time">name</button>
      <label id="fs-hidden-wrap" title="Show hidden files">
        <input id="fs-hidden" type="checkbox" checked> hidden
      </label>
    </span>
  </div>
  <div id="fs-main">
    <div id="fs-list" role="list"></div>
    <div id="fs-splitter" title="Drag to resize" hidden></div>
    <div id="fs-view" hidden>
      <div id="fs-view-head">
        <span id="fs-view-name"></span>
        <span id="fs-view-meta"></span>
        <button id="fs-preview-toggle" class="fs-btn" title="Toggle preview / source" hidden>preview</button>
        <button id="fs-refresh" class="fs-btn" title="Reload file content">⟳</button>
        <label id="fs-wrap-wrap" title="Wrap long lines">
          <input id="fs-wrap" type="checkbox" checked> wrap
        </label>
        <a id="fs-download" class="fs-btn" href="#" download>download</a>
        <button id="fs-close-view" class="fs-btn">close</button>
      </div>
      <pre id="fs-text"></pre>
      <div id="fs-preview" hidden></div>
      <div id="fs-image"></div>
      <div id="fs-note" hidden></div>
    </div>
  </div>
  <script nonce="__PI_WEB_FS_NONCE__">
    window.__PI_WEB_FS_TOKEN__ = "__PI_WEB_FS_TOKEN_VALUE__";
    // 主题尽早应用（与主页面共用 localStorage 的 piweb-theme），避免首屏闪一下再切换
    (function () {
      var t = localStorage.getItem("piweb-theme");
      if (t === "bright") t = "light"; // 旧键名迁移
      document.body.classList.toggle("theme-light", (t || "light") === "light");
    })();
  </script>
  <script src="vendor/marked.min.js"></script>
  <script src="sanitize.js"></script>
  <script src="files.js"></script>
</body>
</html>
