<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pi-web</title>
  <link rel="icon" type="image/svg+xml" href="pi-logo.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="header">
      <span id="title">pi</span>
      <span id="version"></span>
      <span id="theme-switch">
        <span class="theme-option" data-theme="dark">Dark</span>
        <span class="theme-sep">|</span>
        <span class="theme-option" data-theme="light">Light</span>
      </span>
      <span id="msg-nav">
        <span class="nav-btn" id="nav-prev" title="Jump to previous user message">↑</span>
        <span class="nav-btn" id="nav-next" title="Jump to next user message">↓</span>
      </span>
      <span id="conn-status" class="disconnected">Disconnected</span>
    </div>
    <div id="main">
      <div id="scroll-view">
        <div id="content"></div>
      </div>
      <div id="sidebar">
        <div id="loaded-resources"></div>
      </div>
    </div>
    <div id="pending"></div>
    <div id="bash-pending" style="display:none"></div>
    <div id="widgets"></div>
    <div id="status"></div>
    <div id="footer">
      <div id="footer-line"></div>
      <div id="ext-status" style="display:none"></div>
      <div id="footer-stats"></div>
      <div id="command-menu"></div>
      <div class="input-row">
        <div class="history-nav">
          <button id="history-prev" title="Previous input (↑)">↑</button>
          <button id="history-next" title="Next input (↓)">↓</button>
        </div>
        <textarea id="input" placeholder="Send a message... (Enter to send, Shift+Enter for newline)"></textarea>
        <button id="send-btn" title="Send (Enter)">Send</button>
        <button id="abort-btn" title="Abort current operation" style="display:none">Abort</button>
      </div>
    </div>
  </div>
  <div id="modal-overlay" style="display:none">
    <div id="modal">
      <div id="modal-title"></div>
      <input id="modal-search" placeholder="Search..." autocomplete="off">
      <div id="modal-list"></div>
      <div id="modal-close">Close (Esc)</div>
    </div>
  </div>
  <div id="usage-overlay" style="display:none">
    <div id="usage-panel">
      <div id="usage-title">Usage</div>
      <div id="usage-tabs"></div>
      <div id="usage-views"></div>
      <div id="usage-body"></div>
      <div id="usage-close">Close (Esc)</div>
    </div>
  </div>
  <script src="vendor/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
